apiVersion: apps/v1
kind: Deployment
metadata:
  name: clasificaia
spec:
  replicas: 2
  selector:
    matchLabels: {app: clasificaia}
  template:
    metadata:
      labels: {app: clasificaia}
    spec:
      containers:
        - name: api
          image: clasificaia:1.0
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clasificaia
spec:
  selector: {app: clasificaia}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clasificaia
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: clasificaia}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
